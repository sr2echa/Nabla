[workspace]
members = ["crates/nabla-core", "crates/nabla-uci", "crates/nabla-wasm", "crates/nabla-tune"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
authors = ["Sreecharan S."]

[workspace.dependencies]
libm = "0.2"
nabla-core = { path = "crates/nabla-core" }
shakmaty = "0.30.2"
wasm-bindgen = "=0.2.100"

[profile.release]
codegen-units = 1
lto = true
